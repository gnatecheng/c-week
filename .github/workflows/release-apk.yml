name: Release APK

on:
  push:
    tags:
      # Semver only — never date-based tags (e.g. v20260928).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          EXPECTED="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match app/build.gradle.kts versionName ($VERSION_NAME). Expected tag $EXPECTED."
            exit 1
          fi
          echo "Tag $TAG matches versionName $VERSION_NAME"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing."
            echo "Create GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (optional: ANDROID_KEY_PASSWORD)."
            echo "See README §「Release 签名与 GitHub Secrets」 for keystore generation. Refusing to publish an unsigned/debug APK."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager=${SDKM}"
          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" "platforms;android-36" "build-tools;36.0.0"

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      - name: Read versionName and versionCode
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release assets
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          APK_NAME="c-week-${VERSION_NAME}.apk"
          AAB_NAME="c-week-${VERSION_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "${AAB_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "AAB_NAME=${AAB_NAME}" >> "$GITHUB_ENV"
          ls -la "${APK_NAME}" "${AAB_NAME}"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-week-release-aab-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Write release notes
        run: |
          VERSION_CODE="${{ steps.version.outputs.code }}"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::Missing changelog for versionCode ${VERSION_CODE}: ${CHANGELOG}"
            exit 1
          fi
          HIGHLIGHTS=$(sed '/^[[:space:]]*$/d' "$CHANGELOG" | head -n 20)
          if [ -z "$HIGHLIGHTS" ]; then
            echo "::error::Changelog ${CHANGELOG} is empty — release Highlights would be blank."
            exit 1
          fi
          {
            echo "## 更新 Highlights"
            echo
            echo "$HIGHLIGHTS"
            echo
            echo "---"
            echo
            echo "本 Release 附带两个正式签名包（applicationId \`com.py2c.week\`，CI 使用仓库 Secrets 中的发布 keystore 签名）："
            echo "- **APK**（\`c-week-*.apk\`）：侧载 / 官网下载（亦同步至 [dl.etais.dev](https://dl.etais.dev)）。"
            echo "- **AAB**（\`c-week-*.aab\`）：上传 Google Play。"
            echo "Workflow Artifacts 中仍保留 AAB 副本作为备份。"
          } > release_body.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: C一周通 ${{ steps.version.outputs.name }}
          body_path: release_body.md
          files: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}
          fail_on_unmatched_files: true

      - name: Upload release APK to Cloudflare R2 (etai-apk)
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::R2 secrets missing (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID); skipping upload to s3://etai-apk/."
            exit 0
          fi
          APK_NAME="${APK_NAME:?APK_NAME not set}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          aws s3 cp "${APK_NAME}" "s3://etai-apk/${APK_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/vnd.android.package-archive
          LOCAL_SHA=$(sha256sum "${APK_NAME}" | awk '{print $1}')
          REMOTE_SHA=$(curl -fsSL "https://dl.etais.dev/${APK_NAME}" | sha256sum | awk '{print $1}')
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::R2 mirror checksum mismatch for ${APK_NAME}"
            echo "local=${LOCAL_SHA}"
            echo "remote=${REMOTE_SHA}"
            exit 1
          fi
          echo "R2 mirror OK: https://dl.etais.dev/${APK_NAME} (sha256 ${LOCAL_SHA})"

      - name: Upload c-week-version.json to Cloudflare R2 (etai-apk)
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::R2 secrets missing; skipping c-week-version.json upload."
            exit 0
          fi
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          APK_NAME="${APK_NAME:?APK_NAME not set}"
          CHANGELOG_ZH="fastlane/metadata/android/zh-CN/changelogs/${VERSION_CODE}.txt"
          CHANGELOG_EN="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          NOTES_ZH=""
          NOTES_EN=""
          if [ -f "$CHANGELOG_ZH" ]; then
            NOTES_ZH=$(sed '/^[[:space:]]*$/d' "$CHANGELOG_ZH" | head -n 20 | jq -Rs .)
          else
            NOTES_ZH='""'
          fi
          if [ -f "$CHANGELOG_EN" ]; then
            NOTES_EN=$(sed '/^[[:space:]]*$/d' "$CHANGELOG_EN" | head -n 20 | jq -Rs .)
          else
            NOTES_EN='""'
          fi
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://dl.etais.dev/${APK_NAME}" \
            --argjson zh "$NOTES_ZH" \
            --argjson en "$NOTES_EN" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, releaseNotes: {zh: $zh, en: $en}}' \
            > c-week-version.json
          cat c-week-version.json
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          aws s3 cp c-week-version.json "s3://etai-apk/c-week-version.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json
          echo "R2 version manifest OK: https://dl.etais.dev/c-week-version.json"

      - name: Manual run note
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch 仅验证构建与签名，不会创建 GitHub Release。请推送 semver 标签 vX.Y.Z 以发布。"
